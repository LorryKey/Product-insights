<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracker Feedback Dashboard</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6fb;
        --card: #ffffff;
        --text: #1e2a3a;
        --muted: #6f7d96;
        --brand: #2f6bff;
        --border: #e5eaf3;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .page { max-width: 1180px; margin: 0 auto; padding: 28px 18px 44px; }
      h1 { margin: 0 0 6px; font-size: clamp(1.3rem, 1.1rem + 1.4vw, 2rem); }
      .subtitle { margin: 0 0 18px; color: var(--muted); }
      .notice {
        border: 1px dashed var(--border);
        border-radius: 10px;
        background: #f9fbff;
        padding: 10px 12px;
        color: var(--muted);
        margin-bottom: 14px;
        font-size: 0.9rem;
      }
      .kpis { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 10px; margin-bottom: 14px; }
      .kpi, .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
      }
      .kpi .label { color: var(--muted); font-size: .85rem; }
      .kpi .value { font-size: 1.45rem; font-weight: 700; margin-top: 4px; }
      .grid { display: grid; gap: 12px; grid-template-columns: repeat(12,1fr); }
      .span-6 { grid-column: span 6; }
      .span-12 { grid-column: span 12; }
      @media (max-width: 900px) { .span-6 { grid-column: span 12; } }
      h2 { margin: 0 0 10px; font-size: 1.05rem; }
      table { width: 100%; border-collapse: collapse; font-size: .92rem; }
      th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
      th { color: var(--muted); font-weight: 600; }
      .bar-wrap { background: #f1f4fa; border-radius: 999px; height: 8px; overflow: hidden; }
      .bar { background: linear-gradient(90deg, #5a8bff, #2f6bff); height: 100%; }
      blockquote {
        margin: 8px 0;
        border-left: 3px solid #c9d7ff;
        padding: 8px 10px;
        border-radius: 0 8px 8px 0;
        background: #f7f9ff;
        color: #2a3950;
      }
      ul { margin: 8px 0 0 18px; padding: 0; }
      li + li { margin-top: 6px; }
      .muted { color: var(--muted); }
      .error { color: #be123c; background: #fff1f2; border: 1px solid #fecdd3; padding: 8px 10px; border-radius: 8px; }
    </style>
  </head>
  <body>
    <main class="page">
      <h1>Дашборд по опросу пользователей Tracker</h1>
      <p class="subtitle">Автоматически построен на основе <code>tracker_feedback_codex.json</code>.</p>

      <section class="kpis" id="kpis"></section>
      <div class="notice">Метрика в таблицах — количество упоминаний тем в открытых ответах. Один респондент может попадать в несколько тем.</div>

      <section class="grid" id="dashboard"></section>
    </main>

    <script>
      const serviceThemes = [
        ["Фильтры/поиск/сортировка", ["фильтр", "поиск", "сортиров", "избран"]],
        ["Связи и иерархия задач", ["связ", "иерарх", "эпик", "подзадач", "завис"]],
        ["Планирование (Гантт/спринты/версии)", ["гант", "спринт", "верс", "дорожн"]],
        ["Отчётность и аналитика", ["отчет", "аналит", "дашборд", "статистик"]],
        ["Автоматизации и workflow", ["автоматиза", "workflow", "воркфлоу", "переход"]],
      ];

      const boardCardThemes = [
        ["Быстрые действия в карточке", ["копирован", "быстро", "приорит", "исполнител", "новой вкладке"]],
        ["Конструктор досок и swimlane", ["конструктор дос", "свимлейн", "swimlane", "доск"]],
        ["Markdown/вложения/превью", ["markdown", "формат", "вложен", "изображ", "картинк", "превью"]],
        ["Конструктор карточек", ["конструктор карточ", "вид карточ", "карточек задач", "карточ"]],
        ["Связи и подзадачи в карточках", ["связ", "подзадач", "завис"]],
      ];

      const blockerThemes = [
        ["Слабые фильтры/поиск/сортировка", ["фильтр", "поиск", "сортиров"]],
        ["Ограничения карточки (много кликов)", ["копирован", "быстро", "приорит", "редактир", "новой вкладке"]],
        ["Проблемы Markdown/вложений", ["markdown", "формат", "вложен", "изображ", "картинк", "превью"]],
        ["Приватность и права доступа", ["приват", "прав", "доступ"]],
        ["Сложная настройка проектов/типов", ["сложн", "настройк", "переход"]],
      ];

      const quoteIds = {
        service: [3, 2, 10],
        board: [4, 3, 6, 5],
        usage: [15, 31, 127, 120],
        blockers: [3, 10, 5]
      };

      const norm = (value) => (value || "").toString().toLowerCase();
      const fields = ["missing_general_features", "missing_card_features", "dislikes", "other_usage"];

      function hasKeywords(text, keys) {
        const low = norm(text);
        return keys.some((k) => low.includes(k));
      }

      function countThemes(rows, themes, sourceFields) {
        return themes
          .map(([name, keys]) => {
            let count = 0;
            rows.forEach((row) => {
              const hit = sourceFields.some((f) => row[f] && hasKeywords(row[f], keys));
              if (hit) count += 1;
            });
            return { name, count };
          })
          .sort((a, b) => b.count - a.count);
      }

      function getQuotes(rows, ids) {
        return ids
          .map((id) => rows.find((r) => r.id === id))
          .filter(Boolean)
          .map((r) => {
            const text = fields.map((f) => r[f]).find((t) => t && t !== "-" && !/^описал|написал|уже отвечал/i.test(t));
            return { id: r.id, text: text || "(цитата отсутствует)" };
          });
      }

      function topUsage(rows) {
        const usageRows = rows.filter((r) => r.other_usage && r.other_usage.trim());
        return usageRows.map((r) => `id=${r.id}: ${r.other_usage}`);
      }

      function renderTable(items) {
        const max = Math.max(...items.map((i) => i.count), 1);
        return `
          <table>
            <thead><tr><th>Тема</th><th>Упоминаний</th><th style="width:34%">Вес</th></tr></thead>
            <tbody>
              ${items
                .map((i) => {
                  const pct = Math.round((i.count / max) * 100);
                  return `<tr>
                    <td>${i.name}</td>
                    <td>${i.count}</td>
                    <td><div class="bar-wrap"><div class="bar" style="width:${pct}%"></div></div></td>
                  </tr>`;
                })
                .join("")}
            </tbody>
          </table>
        `;
      }

      function renderQuotes(quotes) {
        return quotes.map((q) => `<blockquote>«${q.text}» <span class="muted">(id=${q.id})</span></blockquote>`).join("");
      }

      async function init() {
        try {
          const response = await fetch("tracker_feedback_codex.json");
          if (!response.ok) throw new Error("Не удалось загрузить JSON");
          const payload = await response.json();
          const rows = payload.data || [];

          const service = countThemes(rows, serviceThemes, ["missing_general_features", "dislikes"]);
          const board = countThemes(rows, boardCardThemes, ["missing_general_features", "missing_card_features", "dislikes"]);
          const blockers = countThemes(rows, blockerThemes, ["dislikes"]);
          const usage = topUsage(rows);

          document.getElementById("kpis").innerHTML = `
            <article class="kpi"><div class="label">Всего ответов</div><div class="value">${rows.length}</div></article>
            <article class="kpi"><div class="label">Ответов с dislikes</div><div class="value">${rows.filter((r) => r.dislikes).length}</div></article>
            <article class="kpi"><div class="label">Ответов с missing_general_features</div><div class="value">${rows.filter((r) => r.missing_general_features).length}</div></article>
            <article class="kpi"><div class="label">Ответов с missing_card_features</div><div class="value">${rows.filter((r) => r.missing_card_features).length}</div></article>
          `;

          document.getElementById("dashboard").innerHTML = `
            <article class="panel span-6">
              <h2>1) Топ востребованных функциональностей в сервисе</h2>
              ${renderTable(service)}
              <h2>Прямые цитаты</h2>
              ${renderQuotes(getQuotes(rows, quoteIds.service))}
            </article>

            <article class="panel span-6">
              <h2>2) Топ востребованных функциональностей в канбан-доске и карточках</h2>
              ${renderTable(board)}
              <h2>Прямые цитаты</h2>
              ${renderQuotes(getQuotes(rows, quoteIds.board))}
            </article>

            <article class="panel span-6">
              <h2>3) Как и для чего используют Tracker</h2>
              <ul>${usage.map((item) => `<li>${item}</li>`).join("")}</ul>
              <h2>Прямые цитаты</h2>
              ${renderQuotes(getQuotes(rows, quoteIds.usage))}
            </article>

            <article class="panel span-6">
              <h2>4) Сложности и блокеры</h2>
              ${renderTable(blockers)}
              <h2>Прямые цитаты</h2>
              ${renderQuotes(getQuotes(rows, quoteIds.blockers))}
            </article>

            <article class="panel span-12">
              <h2>5) JTBD, user story и выводы</h2>
              <ul>
                <li><b>Job 1:</b> Когда планирую релизы и спринты, хочу видеть иерархию и зависимости в timeline/Гантт, чтобы управлять рисками сроков.</li>
                <li><b>Job 2:</b> Когда работаю с потоком задач на доске, хочу быстрые действия в карточке, чтобы снизить число кликов и ускорить исполнение.</li>
                <li><b>Job 3:</b> Когда обсуждаю задачи в комментариях, хочу стабильный Markdown и удобные вложения, чтобы не терять контекст.</li>
              </ul>
              <p><b>User story:</b> Как руководитель/PM/исполнитель кросс-функциональной команды, я хочу настраиваемую канбан-доску и функциональные карточки (быстрые действия, зависимости, редактор и вложения), чтобы планировать, координировать и исполнять работу без потери скорости и прозрачности.</p>
              <ul>
                <li>Ключевой запрос пользователей — ускорение базового потока: найти → открыть → изменить → связать → отчитаться.</li>
                <li>Канбан и карточка — основная UX-зона, где концентрируется ежедневная боль.</li>
                <li>Не хватает управленческого слоя: иерархия, зависимости, планирование, отчётность.</li>
              </ul>
            </article>
          `;
        } catch (err) {
          document.getElementById("dashboard").innerHTML = `<div class="panel span-12 error">Ошибка загрузки данных: ${err.message}</div>`;
        }
      }

      init();
    </script>
  </body>
</html>
